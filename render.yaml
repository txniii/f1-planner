services:
  - type: web
    name: f1-planner
    runtime: php
    buildCommand: echo "Build complete"
    startCommand: php -S 0.0.0.0:$PORT -t . router.php
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: f1-planner-db
          property: host
      - key: DB_USER
        fromDatabase:
          name: f1-planner-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: f1-planner-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: f1-planner-db
          property: database
      - key: DB_PORT
        fromDatabase:
          name: f1-planner-db
          property: port

databases:
  - name: f1-planner-db
    databaseName: f1_planner
    plan: free
